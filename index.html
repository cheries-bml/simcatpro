:["don't","do not","don’t"],errorWord:"doesn't",errorIndex:1,explanation:`Plural subject "They" requires "don't" / "do not". Both contraction and full form are accepted, case-insensitive.`},{id:"eng-g-e-5",type:"error_correction",level:"easy",group:"english",topic:"grammar",description:"Click on the incorrect word in the sentence, then type your correction in the box below.",time:{fast:25,normal:50,easy:100},question:"Click the incorrect word and provide correct form.",sentence:"The children is playing in the park.",correctAnswer:{wordIndex:2,correctAnswers:["are","are playing"]},correctAnswers:["are","are playing"],errorWord:"is",errorIndex:2,explanation:'Plural subject "children" needs "are". Accepts "are" or "are playing" as valid, case-insensitive.'}]},"questions/intermediate/english/reading/questions.json":{info:{level:"intermediate",group:"english",topic:"reading",title:"Climate Change Reading",description:"Read passage carefully and answer based on text. Skim first, then scan for details.",time:{fast:40,normal:80,easy:140}},questions:[{id:"eng-r-i-1",type:"multiple_choice",level:"intermediate",group:"english",topic:"reading",description:"Read the passage above, then answer based on information in the text.",time:{fast:35,normal:70,easy:130},passage:"Climate change is no longer a distant threat but a present reality. Rising sea levels, caused by melting polar ice caps, threaten coastal cities worldwide. Scientists agree that reducing carbon emissions by 45% before 2030 is critical to limiting global warming to 1.5°C. However, economic interests often conflict with environmental policies, making international cooperation difficult.",question:"According to the passage, what is the main cause of rising sea levels?",options:{A:"Economic interests",B:"Melting polar ice caps",C:"Coastal cities growth",D:"Carbon emissions directly"},correctAnswer:"B",explanation:'The passage explicitly states "Rising sea levels, caused by melting polar ice caps".'},{id:"eng-r-i-2",ty
